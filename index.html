<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brothers of Legacy: Tears and Blood</title>

    <!-- PWA : installable sur PC et mobile -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#8a0f1a">
    <link rel="icon" type="image/png" sizes="64x64" href="./src/assets/pwa/favicon-64.png">
    <link rel="apple-touch-icon" href="./src/assets/pwa/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brothers of Legacy">

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            width: 100dvw;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Écran "Tournez votre appareil" : le jeu est conçu en format paysage (800x600).
           Sur mobile en portrait, mieux vaut le dire clairement que laisser le jeu
           s'afficher minuscule. N'apparaît que sur petit écran + portrait (pas sur PC). */
        #rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(ellipse at center, #2a0a12 0%, #0a0508 100%);
            color: #f0e6d2;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Georgia, 'Times New Roman', serif;
            padding: 24px;
        }
        #rotate-overlay .icon {
            font-size: 56px;
            animation: rotate-hint 1.6s ease-in-out infinite;
        }
        #rotate-overlay h2 {
            color: #e52b45;
            letter-spacing: 2px;
            margin: 18px 0 8px;
        }
        #rotate-overlay p {
            color: #c9c2b8;
            font-size: 14px;
            max-width: 280px;
        }
        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }
        @media (orientation: portrait) and (max-width: 900px) {
            #rotate-overlay { display: flex; }
        }
    </style>
</head>
<body>
    <div id="rotate-overlay">
        <div class="icon">📱</div>
        <h2>TOURNEZ VOTRE APPAREIL</h2>
        <p>Brothers of Legacy: Tears and Blood se joue en mode paysage, pour profiter pleinement du combat et des menus.</p>
    </div>

    <script type="module" src="./src/main.js"></script>

    <script>
        // Enregistrement du service worker (mise en cache + hors-ligne).
        // Échoue silencieusement si non supporté (ex. ouverture en local sans serveur) — sans impact sur le jeu.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
